<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0f1520;--panel:#172033;--panel2:#1d2940;--ink:#e6ecf5;--muted:#93a1b8;--line:#2a3855;--accent:#5cc8ff;--warn:#f0b955}
:root[data-theme=light]{--bg:#eef1f6;--panel:#ffffff;--panel2:#f3f6fb;--ink:#172033;--muted:#566480;--line:#d3dae6;--accent:#0a74c9;--warn:#a86a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed=true],button.on{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;margin-inline-end:auto}
header input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
header input[type=search]{width:180px}
nav{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}
main{padding:12px 14px 40px;max-width:1280px;margin:auto}
.tab{display:none}.tab.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;align-items:center}
.chips .lbl{color:var(--muted);font-size:13px}
.chips button{padding:4px 10px;font-size:13px}
.scroll{overflow-x:auto;padding-bottom:8px}
#ptable{display:grid;grid-template-columns:repeat(18,minmax(42px,1fr));gap:3px;min-width:790px;direction:ltr}
.cell{position:relative;border-radius:6px;padding:3px 4px;min-height:54px;cursor:pointer;color:#071018;border:2px solid transparent;transition:opacity .15s,transform .1s;user-select:none}
.cell:hover{transform:scale(1.07);z-index:2}
.cell .z{font-size:10px;opacity:.75}
.cell .s{font-size:17px;font-weight:700;line-height:1.05;display:block}
.cell .n{font-size:8.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell.dim{opacity:.16}
.cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.cell.cmp::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#04121c;box-shadow:0 0 0 1.5px #fff}
.ph{border:1px dashed var(--line);border-radius:6px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:15px;margin:0 0 8px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.big{width:84px;height:84px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#071018;flex:none}
.big b{font-size:34px;line-height:1}.big small{font-size:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.cfg{font-family:"Cascadia Mono",Consolas,monospace;font-size:14px;word-break:break-word;direction:ltr;text-align:left}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0;direction:ltr}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.warn{border-inline-start:3px solid var(--warn);padding:6px 10px;background:var(--panel2);border-radius:6px;font-size:13px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#glwrap{position:relative;height:min(68vh,560px);min-height:340px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--panel2),var(--bg))}
#gl{position:absolute;inset:0;touch-action:none}
#gl canvas{width:100%;height:100%;display:block}
#legend{position:absolute;top:8px;inset-inline-start:8px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:60%;pointer-events:none;direction:ltr;text-align:left}
#legend div{display:flex;gap:6px;align-items:center}
#legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
table.cmp{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
table.cmp th{color:var(--muted);font-weight:500}
.pass{color:#4cc27a}.fail{color:#f2705b}
ul.plain{padding-inline-start:18px;margin:6px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.elbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.spacer{flex:1}
.glbox{position:relative;height:min(62vh,520px);min-height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--panel2),var(--bg));margin-top:10px}
.glbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gllegend{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px}
canvas.plot{width:100%;display:block}
.sl{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;flex-wrap:wrap}.sl input[type=range]{flex:1;min-width:120px}
.brow{display:flex;align-items:center;gap:10px;margin:3px 0;direction:ltr}.brow.emp{opacity:.55}
.bl{width:52px;font-family:monospace;font-size:14px}.bb{display:flex;gap:2px}
.box{display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;width:42px;height:46px;border:1.5px solid var(--muted);border-radius:4px;background:var(--panel2);padding:1px}
.box b{font-size:16px;line-height:1.2;color:var(--accent)}.box i{font-size:8.5px;font-style:normal;color:var(--muted)}
.box.ck{cursor:pointer}.box.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
tr.ck{cursor:pointer}tr.ck:hover{background:var(--panel2)}
.shl{border-bottom:1px solid var(--line);padding:2px 0}
textarea{resize:vertical}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <input type="search" id="q" aria-label="search" autocomplete="off">
  <button id="btnLang" aria-label="language">فارسی</button>
  <button id="btnTheme" aria-label="theme"></button>
</header>
<nav id="nav"></nav>
<main>
  <section class="tab" id="tab-table">
    <div class="chips" id="catChips"></div>
    <div class="chips" id="blockChips"></div>
    <div class="chips"><span class="lbl" id="lblColor"></span><select id="colorBy"></select></div>
    <div class="scroll"><div id="ptable" role="grid"></div></div>
    <div id="colorKey" class="chips"></div>
    <div class="grid2">
      <div class="card" id="detail"></div>
      <div class="card" id="detail2"></div>
    </div>
  </section>

  <section class="tab" id="tab-atom">
    <div class="row">
      <button id="prevEl">◀</button>
      <input type="number" id="elNum" min="1" max="118" style="width:78px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px">
      <button id="nextEl">▶</button>
      <strong id="atomName"></strong>
    </div>
    <div class="row" id="modeBtns"></div>
    <div id="glwrap"><div id="gl"></div><div id="legend"></div></div>
    <div class="row">
      <button id="btnPlay"></button>
      <button id="btnReset"></button>
      <span class="note" id="hint"></span>
    </div>
    <div class="warn" id="modeNote"></div>
    <div class="card"><h2 id="aboutH"></h2><div id="about"></div></div>
  </section>

  <section class="tab" id="tab-compare">
    <div class="card"><h2 id="cmpH"></h2><div class="scroll" id="cmpBody"></div></div>
  </section>

  <section class="tab" id="tab-sources">
    <div class="card"><h2 id="srcH"></h2><div id="srcBody"></div></div>
    <div class="card" style="margin-top:12px"><h2 id="testH"></h2><button id="runTests"></button><div id="testOut" style="margin-top:8px"></div></div>
    <div class="card" style="margin-top:12px"><h2 id="roadH"></h2><div id="roadBody"></div></div>
  </section>
</main>

// Layout: grid position (row, col). Rows 9 and 10 hold the f-block strips (57–71, 89–103).
function gridPos(z){
 if(z===1)return[1,1]; if(z===2)return[1,18];
 if(z<=4)return[2,z-2]; if(z<=10)return[2,z+8];
 if(z<=12)return[3,z-10]; if(z<=18)return[3,z];
 if(z<=36)return[4,z-18]; if(z<=54)return[5,z-36];
 if(z<=56)return[6,z-54]; if(z<=71)return[9,z-54]; if(z<=86)return[6,z-68];
 if(z<=88)return[7,z-86]; if(z<=103)return[10,z-86]; return[7,z-100];
}
const SETS={
 alkali:[3,11,19,37,55,87],alkaline:[4,12,20,38,56,88],
 metalloid:[5,14,32,33,51,52],nonmetal:[1,6,7,8,15,16,34],
 halogen:[9,17,35,53,85,117],noble:[2,10,18,36,54,86,118],
 post:[13,31,49,50,81,82,83,84,113,114,115,116]

function category(z){
 for(const k in SETS)if(SETS[k].includes(z))return k;
 if(z>=57&&z<=71)return'lanthanide'; if(z>=89&&z<=103)return'actinide';
 if(z>=109)return'unknown';

}
function periodOf(z){const r=gridPos(z)[0];return r===9?6:r===10?7:r}
function groupOf(z){
 const [r,c]=gridPos(z);
 if(z===71||z===103)return 3;            // Lu, Lr: IUPAC 2021 provisional group 3
 if(r>=9)return null;                    // La–Yb, Ac–No: f-block, no group number

}
function blockOf(z){
 if(z===2)return's'; // He is placed in group 18 but its electrons are 1s²
 const p=periodOf(z); const g=groupOf(z);
 if(z>=57&&z<=70||z>=89&&z<=102)return'f';
 if(z===71||z===103)return'd';           // placement convention; Lr ground state is 7p¹ (see notes)
 if(g===1||g===2)return's'; if(g>=3&&g<=12)return'd'; return'p';

function madelung(z){
 const o={};let left=z;
 for(const[n,l]of ORDER){if(left<=0)break;const t=Math.min(2*(2*l+1),left);o[n+LET[l]]=t;left-=t;}
 return o;
}
function config(z){

 if(e)for(const k in e)o[k]=e[k];
 for(const k in o)if(!o[k])delete o[k];
 return o;
}

 $('#catChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat||null;applyChrome();paintTable()});

 $('#lblColor').textContent=t().colorBy;
 $('#colorBy').innerHTML=Object.keys(t().cb).map(k=>`<option value="${k}" ${k===S.colorBy?'selected':''}>${t().cb[k]}</option>`).join('');

 $('#modeBtns').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;applyChrome();buildAtom()});
 $('#btnPlay').textContent=S.playing?t().play:t().resume;$('#btnReset').textContent=t().reset;$('#hint').textContent=t().hint;
 $('#aboutH').textContent=t().aboutH;$('#cmpH').textContent=t().cmpH;$('#srcH').textContent=t().srcH;

// ---------- periodic table ----------
function colorOf(e){
 if(S.colorBy==='category')return CAT[e.cat].c;
 if(S.colorBy==='block')return BLOCKC[e.block];
 if(S.colorBy==='chi'){if(e.chi==null)return'#6b7488';const x=(e.chi-0.7)/(3.98-0.7);return`hsl(${230-210*x} 75% 58%)`}
 const x=Math.min(1,e.A/294);return`hsl(${200-10*x} 70% ${85-50*x}%)`;
}
function buildTable(){
 const host=$('#ptable');host.innerHTML='';
 const ph=(r,c,txt)=>{const d=document.createElement('div');d.className='ph';d.style.gridRow=r;d.style.gridColumn=c;d.textContent=txt;host.appendChild(d)};
 ph(6,3,'57–71');ph(7,3,'89–103');
 EL.forEach(e=>{
  const d=document.createElement('div');d.className='cell';d.dataset.z=e.z;d.tabIndex=0;d.setAttribute('role','gridcell');
  d.style.gridRow=e.pos[0];d.style.gridColumn=e.pos[1];
  d.innerHTML=`<span class="z">${e.z}</span><span class="s">${e.sym}</span><span class="n"></span>`;
  d.onclick=()=>select(e.z);d.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(e.z)}};
  host.appendChild(d);
 });
 // spacer row between main table and f-block strips
 const sp=document.createElement('div');sp.style.gridRow=8;sp.style.gridColumn='1 / 3';sp.style.height='8px';host.appendChild(sp);
}
function matches(e){
 if(S.cat&&e.cat!==S.cat)return false;
 if(S.block&&e.block!==S.block)return false;
 const q=S.q.trim().toLowerCase();
 if(q&&!(e.sym.toLowerCase()===q||e.en.toLowerCase().includes(q)||e.fa.includes(S.q.trim())||String(e.z)===q))return false;
 return true;
}
function paintTable(){
 document.querySelectorAll('.cell').forEach(c=>{
  const e=EL[c.dataset.z-1];
  c.style.background=colorOf(e);
  c.classList.toggle('dim',!matches(e));
  c.classList.toggle('sel',e.z===S.sel);
  c.classList.toggle('cmp',S.cmp.includes(e.z));
  c.querySelector('.n').textContent=S.lang==='fa'?e.fa:e.en;
  c.title=`${e.z} ${e.en} / ${e.fa}`;
 });
 // color key
 let key='';
 if(S.colorBy==='category')key=Object.keys(CAT).map(k=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CAT[k].c}"></i> ${catName(k)}</span>`).join(' ');
 else if(S.colorBy==='block')key=['s','p','d','f'].map(b=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${BLOCKC[b]}"></i> ${b}</span>`).join(' ');
 else key=`<span class="note">${S.colorBy==='chi'?'0.7 → 3.98 (grey = no value)':'1 → 294'}</span>`;
 $('#colorKey').innerHTML=key;
}

// ---------- detail ----------
function massText(e){return e.radioactiveNoStd?`${e.mass} (mass number)`:`${e.mass}`}
function paintDetail(){
 const e=EL[S.sel-1],T=t(),o=config(e.z),sh=shells(e.z);
 const N=e.A-e.z;
 $('#detail').innerHTML=`
  <div class="head"><div class="big" style="background:${CAT[e.cat].c}"><small>${e.z}</small><b>${e.sym}</b></div>
  <div><div style="font-size:19px;font-weight:700">${elName(e)}</div><div class="note" style="margin:0">${catName(e.cat)}</div></div></div>
  <dl class="kv">
   <dt>${T.z}</dt><dd>${e.z}</dd>
   <dt>${T.mass}</dt><dd>${massText(e)}</dd>
   <dt>${T.p}</dt><dd>${e.z}</dd>
   <dt>${T.n}</dt><dd>≈ ${N}</dd>
   <dt>${T.e}</dt><dd>${e.z}</dd>
   <dt>${T.per}</dt><dd>${e.period}</dd>
   <dt>${T.grp}</dt><dd>${e.group??'—'}</dd>
   <dt>${T.blk}</dt><dd>${e.block}</dd>
   <dt>${T.chi}</dt><dd>${e.chi??'—'}</dd>
   <dt>${T.state}</dt><dd>${T.states[e.state]}</dd>
  </dl>
  <div class="row"><button id="bCmp">${S.cmp.includes(e.z)?T.rmCmp:T.addCmp}</button><button id="b3d">${T.open3d}</button></div>
  <div id="cmpMsg" class="note"></div>`;
 $('#bCmp').onclick=()=>toggleCmp(e.z);
 $('#b3d').onclick=()=>showTab('atom');
 const max=Math.max(...Object.values(sh));
 const order=sortKeys(o);
 $('#detail2').innerHTML=`
  <h2>${T.cfg}</h2><div class="cfg">${cfgText(o)}</div>
  <h2 style="margin-top:12px">${T.nob}</h2><div class="cfg">${shorthand(e.z)}</div>
  ${e.exception?`<div class="warn">${T.exNote}</div>`:''}
  ${e.predicted?`<div class="warn">${T.predNote}</div>`:''}
  ${e.z===103?`<div class="warn">${T.lrNote}</div>`:''}
  <h2 style="margin-top:12px">${T.shells}</h2>
  ${Object.keys(sh).map(n=>`<div class="bar"><span style="width:70px">n=${n}</span><i style="width:${sh[n]/max*55}%"></i><span>${sh[n]} <span class="note">/ ${2*n*n}</span></span></div>`).join('')}
  <h2 style="margin-top:12px">${T.subs}</h2>
  <div class="cfg">${order.map(k=>`${k}: ${o[k]}/${2*(2*LET.indexOf(k[1])+1)}`).join(' · ')}</div>
  <p class="note">${T.pending}</p>`;
}
function toggleCmp(z){
 const i=S.cmp.indexOf(z);
 if(i>=0)S.cmp.splice(i,1);
 else if(S.cmp.length>=4){$('#cmpMsg').textContent=t().cmpFull;return}
 else S.cmp.push(z);
 paintTable();paintDetail();paintCompare();
}
function paintCompare(){
 const T=t();
 if(!S.cmp.length){$('#cmpBody').innerHTML=`<p class="note">${T.cmpEmpty}</p>`;return}
 const E=S.cmp.map(z=>EL[z-1]);
 const rows=[
  [T.z,e=>e.z],[T.mass,massText],[T.p,e=>e.z],[T.e,e=>e.z],[T.n,e=>'≈ '+(e.A-e.z)],
  [T.per,e=>e.period],[T.grp,e=>e.group??'—'],[T.blk,e=>e.block],[T.cat,e=>catName(e.cat)],
  [T.chi,e=>e.chi??'—'],[T.state,e=>T.states[e.state]],
  [T.nob,e=>`<span class="cfg">${shorthand(e.z)}</span>`],
  [T.shells,e=>{const s=shells(e.z);return Object.keys(s).map(n=>s[n]).join(', ')}],
  [T.subs,e=>`<span class="cfg">${sortKeys(config(e.z)).map(k=>k+':'+config(e.z)[k]).join(' ')}</span>`]
 ];
 $('#cmpBody').innerHTML=`<table class="cmp"><tr><th></th>${E.map(e=>`<th style="color:${CAT[e.cat].c};font-size:16px">${e.sym} <span style="color:var(--muted);font-size:12px">${S.lang==='fa'?e.fa:e.en}</span> <button data-rm="${e.z}" style="padding:0 6px">×</button></th>`).join('')}</tr>
 ${rows.map(r=>`<tr><th>${r[0]}</th>${E.map(e=>`<td>${r[1](e)}</td>`).join('')}</tr>`).join('')}</table>`;
 $('#cmpBody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>toggleCmp(+b.dataset.rm));
}

function select(z){
 S.sel=Math.max(1,Math.min(118,z));
 paintTable();paintDetail();paintAtomHeader();
 if(S.tab==='atom')buildAtom();
}
function showTab(k){
 S.tab=k;
 document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('show',s.id==='tab-'+k));
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===k));
 if(k==='atom'){initGL();resizeGL();buildAtom();paintAtomHeader()}
 if(k==='compare')paintCompare();
}

// ---------- 3D ----------
let R,scene,cam,atomG,tnow=0,glReady=false,cs={th:.6,ph:1.25,rad:12,tx:new THREE.Vector3()};
let electrons=[],nucleus=null,defaultRad=12;
function rn(n){return 1.5+0.95*(n-1)}
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function updateCam(){
 const sp=Math.sin(cs.ph);
 cam.position.set(cs.tx.x+cs.rad*sp*Math.sin(cs.th),cs.tx.y+cs.rad*Math.cos(cs.ph),cs.tx.z+cs.rad*sp*Math.cos(cs.th));
 cam.lookAt(cs.tx);cam.updateMatrixWorld();
}
function resizeGL(){
 if(!glReady)return;const h=$('#gl');const w=h.clientWidth,H=h.clientHeight;
 if(!w||!H)return;R.setSize(w,H,false);cam.aspect=w/H;cam.updateProjectionMatrix();
}
function initGL(){
 if(glReady)return;glReady=true;
 const host=$('#gl');
 R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(R.domElement);
 scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,1,.1,500);
 scene.add(new THREE.AmbientLight(0xffffff,.7));
 const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,8,6);scene.add(dl);
 atomG=new THREE.Group();scene.add(atomG);
 updateCam();
 const ptr=new Map();let last=null;
 const cv=R.domElement;
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey})});
 cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);last=null});
 cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);last=null});
 const pan=(dx,dy)=>{
  const r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1),k=cs.rad*.0016;
  cs.tx.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);
 };
 cv.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===1){

const DSR={bundled:mkBundled(),imported:[],hyd:{}};
const hydDs=z=>DSR.hyd[z]||(DSR.hyd[z]=mkHydrogenic(z));
function datasetsFor(z){const a=[];DSR.bundled.filter(d=>d.z===z).forEach(d=>a.push(d));DSR.imported.filter(d=>d.z===z).forEach(d=>a.push(d));a.push(hydDs(z));return a}

const KIND={computed:['Computed (theory)','محاسبه‌شده (نظری)'],reference:['Literature reference (typed, partial)','مرجع ادبیات (واردشده، ناقص)'],imported:['Imported NIST ASD export','وارد شده از خروجی NIST ASD']};

const PRESET={xray:[0.5,100],uv:[10,400],vis:[380,750],ir:[750,5000],all:[10,2500]};
const PALETTE=['#ff7a59','#4cc2f0','#e6d84f','#b784e6','#5fd36f','#ff8fc0'];
class SpecView{
 constructor(cv,o){this.cv=cv;this.o=o;this.ctx=cv.getContext('2d');this.unit='nm';this.medium='nist';this.v=[380,750];this.hits=[];this.hover=null;this.bind();new ResizeObserver(()=>this.draw()).observe(cv.parentElement)}
 toX(vac){return this.unit==='nm'?(this.medium==='nist'?nistWl(vac):vac):this.unit==='thz'?PC.c/vac*1e-3:PC.hc_eVnm/vac}
 nmOf(x){return this.unit==='nm'?x:this.unit==='thz'?299792.458/x:PC.hc_eVnm/x}
 xOfNm(nm){return this.unit==='nm'?nm:this.unit==='thz'?299792.458/nm:PC.hc_eVnm/nm}
 range(){const a=this.nmOf(this.v[0]),b=this.nmOf(this.v[1]);return[Math.min(a,b),Math.max(a,b)]}
 setNm(a,b){const x1=this.xOfNm(a),x2=this.xOfNm(b);this.v=[Math.min(x1,x2),Math.max(x1,x2)];this.draw()}
 setUnit(u){const r=this.range();this.unit=u;this.setNm(r[0],r[1])}
 zoom(f,cx){const[lo,hi]=this.v,c=cx==null?(lo+hi)/2:cx,s=Math.max((hi-lo)*f,Math.max(Math.abs(hi),Math.abs(lo))*1e-5);this.v=[c-(c-lo)/(hi-lo)*s,c+(hi-c)/(hi-lo)*s];this.draw()}
 pad(){return{l:14,r:14,t:30,b:50}}
 bind(){const cv=this.cv,ptr=new Map();let moved=0;cv.style.touchAction='none';
  const xval=px=>{const p=this.pad(),W=cv.clientWidth;return this.v[0]+(px-p.l)/(W-p.l-p.r)*(this.v[1]-this.v[0])};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=0});
  cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<5)this.click(e.offsetX,e.offsetY)});
  cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
  cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);const W=cv.clientWidth,pd=this.pad(),pw=W-pd.l-pd.r;
   if(!p){this.hover=this.near(e.offsetX,e.offsetY);cv.style.cursor=this.hover?'pointer':'grab';this.draw();return}
   if(ptr.size===1){const dx=e.offsetX-p.x;moved+=Math.abs(dx);const sh=dx/pw*(this.v[1]-this.v[0]);this.v=[this.v[0]-sh,this.v[1]-sh];p.x=e.offsetX;p.y=e.offsetY;this.draw()}
   else if(ptr.size===2){const ids=[...ptr.keys()],a=ptr.get(ids[0]),b=ptr.get(ids[1]);const d0=Math.abs(a.x-b.x);p.x=e.offsetX;const d1=Math.abs(a.x-b.x);moved+=9;if(d0>5&&d1>5)this.zoom(d0/d1,xval((a.x+b.x)/2))}});
  cv.addEventListener('wheel',e=>{e.preventDefault();this.zoom(Math.exp(e.deltaY*.0016),xval(e.offsetX))},{passive:false});
  cv.addEventListener('pointerleave',()=>{this.hover=null;this.draw()});
 }
 near(x,y){let b=null,bd=9;for(const h of this.hits){const d=Math.abs(h.x-x);if(d<bd&&y>=h.y0-6&&y<=h.y1+6){bd=d;b=h}}return b}
 click(x,y){const h=this.near(x,y);if(h&&this.o.onSelect)this.o.onSelect(h.ref)}
 ticks(lo,hi,n){const raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<1.5?1:m<3.5?2:m<7.5?5:10)*p,out=[];for(let t=Math.ceil(lo/st)*st;t<=hi+1e-9;t+=st)out.push(+t.toPrecision(12));return out}

const denCache={};
function denCanvas(n,l,R){const key=[n,l,R].join();if(denCache[key])return denCache[key];const k0=l===1?2:0,M=120,c=document.createElement('canvas');c.width=c.height=M;const x=c.getContext('2d'),im=x.createImageData(M,M);let mx=0;const v=new Float32Array(M*M);
 for(let j=0;j<M;j++)for(let i=0;i<M;i++){const px=-R+2*R*(i+.5)/M,pz=R-2*R*(j+.5)/M,p=psi(n,l,k0,px,0,pz);v[j*M+i]=p*p;mx=Math.max(mx,p*p)}
 for(let q=0;q<M*M;q++){const a=Math.pow(v[q]/mx,.45);im.data[4*q]=90;im.data[4*q+1]=200;im.data[4*q+2]=255;im.data[4*q+3]=Math.round(255*a)}x.putImageData(im,0,0);return(denCache[key]=c)}
function animLoop(){
 requestAnimationFrame(animLoop);const cv=$('#lv-anim');if(!cv||cv.offsetParent===null)return;const W=cv.clientWidth,H=cv.clientHeight,dpr=devicePixelRatio||1;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--muted').trim();
 const t=lvTrans(),ds=dsById(LV.dsId);if(!t||t.err||t.rule.verdict!=='allowed'){x.fillStyle=mut;x.font='13px sans-serif';x.textAlign='center';x.fillText(Lg('Select an allowed transition (upper and lower level) to animate it.','یک گذار مجاز (تراز بالا و پایین) انتخاب کنید.'),W/2,H/2);return}
 const T=(performance.now()-LV.t0)/1000,loop=T%7,s=Math.max(0,Math.min(1,(loop-1.2)/1.6)),sm=s*s*(3-2*s),cx=W*.38,cy=H/2,sz=Math.min(H-20,150);
 // energy ladder
 const lx=14,lw=70,yU=24,yL=H-30;x.strokeStyle=mut;x.lineWidth=1;[[yU,t.u,1-sm],[yL,t.l,sm]].forEach(([y,l,w])=>{x.strokeStyle=ink;x.lineWidth=3;x.beginPath();x.moveTo(lx,y);x.lineTo(lx+lw,y);x.stroke();x.lineWidth=1;x.fillStyle=`rgba(255,190,60,${.15+.85*w})`;x.fillRect(lx,y-4,lw*w,8);x.fillStyle=ink;x.font='11px sans-serif';x.textAlign='left';x.fillText(l.label,lx+lw+6,y+4)});
 x.fillStyle=mut;x.font='10px sans-serif';x.fillText(Lg('state weight','وزن حالت'),lx,yU-8);
 // atom (charge density cross-fade)
 if(ds.hydrogenic){const R=radialExtent(Math.max(t.u.n,t.l.n),0)*.8,cu=denCanvas(t.u.n,t.u.l,R),cl=denCanvas(t.l.n,t.l.l,R);x.globalCompositeOperation='lighter';x.globalAlpha=1-sm;x.drawImage(cu,cx-sz/2,cy-sz/2,sz,sz);x.globalAlpha=sm;x.drawImage(cl,cx-sz/2,cy-sz/2,sz,sz);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.fillStyle=mut;x.font='10px sans-serif';x.textAlign='center';x.fillText(Lg('|ψ|² cross-section (x–z plane), cross-faded','مقطع |ψ|² (صفحه x–z)، محوشونده'),cx,cy+sz/2+10)}
 else{const g=x.createRadialGradient(cx,cy,2,cx,cy,sz/2);g.addColorStop(0,`rgba(90,200,255,${.9-.5*sm})`);g.addColorStop(1,'rgba(90,200,255,0)');x.fillStyle=g;x.fillRect(cx-sz/2,cy-sz/2,sz,sz);x.fillStyle=mut;x.textAlign='center';x.font='10px sans-serif';x.fillText(Lg('schematic atom (no orbital data for this species)','اتم شماتیک (داده اوربیتال برای این گونه نیست)'),cx,cy+sz/2+10)}
 // photon
 const rgb=wl2rgb(t.ph.nm),col=rgb?`rgb(${rgb})`:mut,lam=12+40*(Math.log10(Math.max(t.ph.nm,10))-1)/3;
 if(loop>2.3){const ph=Math.min(1,(loop-2.3)/3.4),x0=cx+sz/2+8,len=(W-x0-20)*ph,front=x0+len;x.strokeStyle=col;x.lineWidth=2.2;if(!rgb)x.setLineDash([5,3]);x.beginPath();
  for(let px=0;px<=len;px+=1.5){const env=Math.min(1,px/40)*Math.min(1,(len-px)/20+.2),yy=cy+Math.sin(2*Math.PI*(px/lam-T*1.5))*22*env;px?x.lineTo(x0+px,yy):x.moveTo(x0,yy)}x.stroke();x.setLineDash([]);x.lineWidth=1;
  x.fillStyle=ink;x.font='12px sans-serif';x.textAlign='right';x.fillText(`hν = ${t.ph.eV.toFixed(4)} eV · λ = ${nistWl(t.ph.nm).toFixed(2)} nm${rgb?'':' ('+Lg('invisible','نامرئی')+')'}`,W-8,H-8)}
}
animLoop();

// ============ SPECTRUM COMPARISON ============
const CMP={items:[],stacked:false,selZ:2,selDs:null};
function cmpTracks(){return CMP.items.filter(i=>i.on).map(i=>({ds:dsById(i.id),color:i.color})).filter(t=>t.ds)}
function cmpAdd(id){if(!id||CMP.items.find(i=>i.id===id))return false;if(CMP.items.length>=6)return false;const used=CMP.items.map(i=>i.color),col=PALETTE.find(c=>!used.includes(c));CMP.items.push({id,on:true,color:col});return true}
function renderSpecCmp(){
 hiSet=null;
 if(!SCV)SCV=new SpecView($('#sc-cv'),{tracks:cmpTracks,colorByWl:false,stacked:false,onSelect:selectLine});
 const ds=datasetsFor(CMP.selZ);if(!CMP.selDs||!ds.find(d=>d.id===CMP.selDs))CMP.selDs=ds[0].id;
 $('#sc-ctl').innerHTML=`<div class="row"><span class="note">${Lg('Add spectrum','افزودن طیف')}</span><select id="sc-z">${EL.map(e=>`<option value="${e.z}" ${e.z===CMP.selZ?'selected':''}>${e.z} ${e.sym} — ${e.en}</option>`).join('')}</select>
 <select id="sc-ds">${ds.map(d=>`<option value="${d.id}" ${d.id===CMP.selDs?'selected':''}>${d.label} · ${Lg(...KIND[d.kind])}</option>`).join('')}</select><button id="sc-add">＋ ${Lg('Add','افزودن')}</button></div>
 <div class="row"><span class="note">${Lg('Presets','پیش‌تنظیم‌ها')}</span>${[['H','He'],['Na','H'],['Fe','Cu'],['Ne','Ar']].map(p=>`<button data-p="${p.join(',')}">${p[0]} vs ${p[1]}</button>`).join('')}<button id="sc-clr">${Lg('Clear','پاک کردن')}</button></div>
 <div class="row"><span class="note">${Lg('Axis','محور')}</span>${[['nm','λ nm'],['thz','ν THz'],['ev','E eV']].map(u=>`<button data-u="${u[0]}" aria-pressed="${SCV.unit===u[0]}">${u[1]}</button>`).join('')}${[['uv','UV'],['vis',Lg('Visible','مرئی')],['ir','IR'],['all',Lg('All','همه')]].map(r=>`<button data-r="${r[0]}">${r[1]}</button>`).join('')}<label><input type="checkbox" id="sc-st" ${CMP.stacked?'checked':''}> ${Lg('stacked lanes','خطوط جداگانه')}</label></div><div id="sc-msg" class="note"></div>`;
 $('#sc-z').onchange=e=>{CMP.selZ=+e.target.value;CMP.selDs=null;renderSpecCmp()};$('#sc-ds').onchange=e=>CMP.selDs=e.target.value;
 $('#sc-add').onclick=()=>{if(!cmpAdd(CMP.selDs))$('#sc-msg').textContent=Lg('Already added or limit of 6 reached.','قبلاً افزوده شده یا به حد ۶ رسیده‌اید.');else renderSpecCmp()};
 $('#sc-clr').onclick=()=>{CMP.items=[];renderSpecCmp()};
 $$('#sc-ctl [data-p]').forEach(b=>b.onclick=()=>{const miss=[];b.dataset.p.split(',').forEach(sym=>{const z=EL.find(e=>e.sym===sym).z,a=datasetsFor(z),pick=a.find(d=>!d.hydrogenic)||(z===1?a[0]:null);if(pick)cmpAdd(pick.id);else miss.push(sym)});
  renderSpecCmp();if(miss.length)$('#sc-msg').innerHTML=`<span class="fail">${Lg(`No observed-line dataset loaded for ${miss.join(', ')} — nothing invented. Import NIST ASD lines on the Emission Spectrum page; the hydrogen-like ion can be added manually from the list.`,`برای ${miss.join('، ')} مجموعه داده خطوط مشاهده‌ای بارگذاری نشده و چیزی ساخته نمی‌شود. خطوط NIST ASD را در صفحه طیف نشری وارد کنید؛ یون هیدروژن‌گونه را می‌توانید دستی از فهرست اضافه کنید.`)}</span>`});
 $$('#sc-ctl [data-u]').forEach(b=>b.onclick=()=>{SCV.setUnit(b.dataset.u);renderSpecCmp()});$$('#sc-ctl [data-r]').forEach(b=>b.onclick=()=>{const r=PRESET[b.dataset.r];SCV.setNm(r[0],r[1])});
 $('#sc-st').onchange=e=>{CMP.stacked=e.target.checked;SCV.o.stacked=CMP.stacked;SCV.draw()};SCV.o.stacked=CMP.stacked;
 $('#sc-list').innerHTML=`<h2>${Lg('Spectra shown','طیف‌های نمایش‌داده‌شده')}</h2>${CMP.items.length?CMP.items.map((it,i)=>{const d=dsById(it.id),vis=d.lines.filter(l=>l.vac>=380&&l.vac<=750).length;return `<div class="row" style="margin:3px 0"><label><input type="checkbox" data-t="${i}" ${it.on?'checked':''}> <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${it.color};vertical-align:middle"></span> <b>${d.label}</b></label><span class="note" style="margin:0">${d.lines.length} ${Lg('lines','خط')} · ${vis} ${Lg('visible','مرئی')} · ${Lg(...KIND[d.kind])}</span><button data-rm="${i}" style="padding:0 7px">×</button></div>`}).join(''):`<p class="note">${Lg('Add spectra with the controls above, or use a preset.','با کنترل‌های بالا طیف اضافه کنید یا پیش‌تنظیم بزنید.')}</p>`}
 <p class="note">${Lg('Line colours identify the species. Intensities in different datasets are not comparable (arbitrary, source-specific units; many datasets have none).','رنگ خطوط گونه را مشخص می‌کند. شدت‌ها در مجموعه‌های مختلف قابل مقایسه نیستند (واحد دلخواه؛ بسیاری از مجموعه‌ها شدت ندارند).')}</p>`;
 $$('#sc-list [data-t]').forEach(b=>b.onchange=()=>{CMP.items[+b.dataset.t].on=b.checked;SCV.draw()});$$('#sc-list [data-rm]').forEach(b=>b.onclick=()=>{CMP.items.splice(+b.dataset.rm,1);renderSpecCmp()});
 $('#sc-note').textContent=Lg('Drag = pan · wheel/pinch = zoom · click a line for details. Each line stays tied to its species and ionisation stage.','کشیدن = جابه‌جایی · چرخ/دو انگشت = زوم · برای جزئیات روی خط کلیک کنید. هر خط به گونه و مرحله یونش خود وابسته است.');
 paintLineViews();SCV.draw();
}

// ============ wiring: tab hooks, sync, language, theme ============
const RENDER={cutaway:renderCutaway,econfig:renderEconfig,orbital:renderOrbital,elorbital:renderElOrbital,levels:renderLevels,spectrum:()=>{if(!SP._init||SP._z!==S.sel){spDefault();SP._init=true;SP._z=S.sel;SP._fit=null}renderSpectrum()},speccmp:renderSpecCmp};
const dirty=new Set(Object.keys(RENDER));
const _showTab=showTab;
showTab=function(k){_showTab(k);paintBars();if(RENDER[k]){if(dirty.has(k)){dirty.delete(k);RENDER[k]()}}
 setTimeout(()=>{[cwV,ogScene&&ogScene.v,eoScene&&eoScene.v].forEach(v=>v&&v.resize());[SPV,SCV,LVS].forEach(v=>v&&v.draw());drawLevels()},30)};
const _select=select;
select=function(z){_select(z);Object.keys(RENDER).forEach(k=>{if(k!=='orbital')dirty.add(k)});if(S.tab!=='table'&&RENDER[S.tab]&&S.tab!=='orbital'){dirty.delete(S.tab);RENDER[S.tab]()}paintBars()};
const _pd=paintDetail;
paintDetail=function(){_pd();const d=$('#detail');if(d){const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="note">${Lg('Go to:','برو به:')}</span>${linksHTML()}`;d.appendChild(r);wireBar(r)}};
const _lang=$('#btnLang').onclick;$('#btnLang').onclick=()=>{_lang();Object.keys(RENDER).forEach(k=>dirty.add(k));paintBars();if(RENDER[S.tab]){dirty.delete(S.tab);RENDER[S.tab]()}paintDetail()};
const _th=$('#btnTheme').onclick;$('#btnTheme').onclick=()=>{_th();[SPV,SCV,LVS].forEach(v=>v&&v.draw());drawLevels()};
addEventListener('resize',()=>{[SPV,SCV,LVS].forEach(v=>v&&v.draw());drawLevels()});
